name: Build Plugin ZIP

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create plugin ZIP
        run: |
          ZIP_NAME="darkadmin-dark-mode-for-adminpanel-dev.zip"
          ZIP_PATH="/tmp/${ZIP_NAME}"

          find . \
            -not -path './.git/*' \
            -not -path './.git' \
            -not -path './.github/*' \
            -not -path './.github' \
            -not -path './tests/*' \
            -not -path './tests' \
            -not -path './vendor/*' \
            -not -path './vendor' \
            -not -name '*.md' \
            -not -name 'LICENSE' \
            -not -name '*.zip' \
            -not -name '*.png' \
            -not -name '*.jpg' \
            -not -name '*.jpeg' \
            -not -name '*.gif' \
            -not -name '*.webp' \
            -not -name '*.svg' \
            -not -name '*.po' \
            -not -name '*.pot' \
            -not -name 'readme-de.txt' \
            -not -name 'CHANGELOG*.txt' \
            -not -name 'composer.json' \
            -not -name 'composer.lock' \
            -not -name 'phpunit.xml' \
            -not -name '.distignore' \
            -type f \
          | sed 's|^\./||' \
          | zip "$ZIP_PATH" -@

          echo "ZIP_PATH=${ZIP_PATH}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: darkadmin-dark-mode-for-adminpanel
          path: ${{ env.ZIP_PATH }}
          retention-days: 1
